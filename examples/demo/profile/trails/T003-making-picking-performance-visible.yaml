competencies:
  - {name: working with operations teams, evidence: "Two night shifts on the floor before building (A2)"}
  - {name: training, evidence: "Trained eight shift leaders at handover (A4)"}
skills_used: [Power BI, Power Query, SQL Server, Excel, training]
keywords: [warehouse, picking accuracy, operations, logistics KPIs, shift leaders, dashboards, supply chain]
accomplishments:
  - "Built an hourly picking-accuracy report from scanner data for 8 shift leaders across two warehouses; picking errors fell 18% within three months"
  - "Trained all shift leaders to use the report at shift handover after observing two night shifts on the warehouse floor"
