  location: Kraków, Poland
  email: aleksandra.nowak@example.com
  phone: "+48 600 100 200"
  links:
    - {kind: linkedin, url: "https://www.linkedin.com/in/aleksandra-nowak-example"}

summary: >-
  Data analyst with 6 years in retail and logistics, now aiming for a Senior Data Analyst role close
  to operations. Combines Python demand forecasting and Power BI dashboards on tested dbt models with
  stakeholder management that starts on the warehouse floor or in the meeting room. At Lumina Retail,
  a garden-range model cut forecast error from 31% to 19% MAPE in back-tests and won the company's
  2024 Analytics Impact Award.

