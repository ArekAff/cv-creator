summary: "First draft: every claim traces to the knowledge base, the build is clean on one full page, and six of eight bullets prove the ad's duties with real figures, so it passes at the threshold. What holds it back: the ad's outcome ('decisions our hub managers trust') is never echoed, the current role's third bullet is a keyword fragment without a result, and mentoring analysts at work is unproven."
