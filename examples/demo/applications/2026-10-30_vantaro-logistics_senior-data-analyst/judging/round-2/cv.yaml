# DEMO DATA — tailored CV: Senior Data Analyst, Network Planning, Vantaro Logistics.
# Track: technical (T-rules) + borrowed N-1, N-5. Every bullet carries `source:` ids from the knowledge base.
# Round 2: revised from judging/round-1/judge.yaml (F1, F2, F5, F6 applied; F3, F4, F7, F8 await her answers).
meta:
  template: jakes
  language: en
  paper: a4
  font_size: 11pt
  date_format: short
  max_pages: 1
  # T-6, senior order (6 years in data analytics): experience before skills; volunteering right after
  # experience because it proves the mentoring duty; certifications back two must-have tools.
  sections_order: [summary, experience, volunteering, skills, certifications, education, languages]
  hide: [languages]                       # notes.md: spoken languages live in the skills block (one page)
  headings: {skills: Technical Skills}    # notes.md: the person's requested heading
  target: {company: Vantaro Logistics, role: Senior Data Analyst}

header:
  name: Aleksandra Nowak
  headline: "Data Analyst · Forecasting, Power BI and dbt · Retail and Logistics"
  location: Kraków, Poland
  email: aleksandra.nowak@example.com
  phone: "+48 600 100 200"
  links:
    - {kind: linkedin, url: "https://www.linkedin.com/in/aleksandra-nowak-example"}

# Round 2 (F1): built on her own draft (insights.summary_drafts; "reports" -> "dashboards" per the
# T001/T003 keywords), so the ad's "decisions" outcome is echoed in her words.
summary: >-
  Data analyst with 6 years in retail and logistics who builds forecasts and dashboards around the
  decisions operations teams make every week, now aiming for a Senior Data Analyst role. Works in
  Python, Power BI and tested dbt models, with stakeholder management that starts on the warehouse
  floor or in the meeting room. At Lumina Retail, a garden-range forecast cut error from 31% to 19%
  MAPE in back-tests and won the 2024 Analytics Impact Award.

experience:
  - title: Data Analyst
    organization: Lumina Retail
    location: Kraków, Poland
    start: 2023-07
    end: present
    description: "Home and garden e-commerce retailer, about 400 people, 6 sales regions"
    bullets:
      - text: "Built a gradient-boosting demand forecast for the summer garden range in Python (pandas, scikit-learn) with weather and promotion features; back-tested on two seasons, it cut forecast error from 31% to 19% MAPE"
        source: [T002]
      - text: "Explained the forecast to the buying team as ranges, not single numbers, with a one-page explainer; end-of-season markdown stock was about 12% lower than in 2023"
        source: [T002]
      # Round 2 (F2): one working sentence; window functions used weekly in the dbt models (gap interview).
      - text: "Own the weekly commercial reporting suite and its data modelling in dbt, writing SQL with window functions"
        source: [P01, T001]
      # Round 2 (F2, optional part): the line freed by the layout change; P01 responsibility, ad's "reliable".
      - text: "Run data-quality checks on the order pipeline"
        source: [P01]
  - title: Junior Data Analyst
    organization: Lumina Retail
    location: Kraków, Poland
    start: 2022-04
    end: 2023-06
    bullets:
      # Round 2 (F5): "self-service" is in T001's keywords (managers opened the prototype on their phones).
      # The space in this bullet's "Power BI" is a non-breaking space (U+00A0, rendered as LaTeX ~),
      # so the line break doesn't split the product name.
      - text: "Sat in on three regional Monday meetings, then replaced a 40-tab Excel pack with a one-page self-service Power BI dashboard of the five KPIs managers used; preparation fell from about 6 hours to 30 minutes a week"
        source: [T001]
      - text: "Moved the manual SQL extracts into tested dbt models on PostgreSQL, eliminating copy-paste errors, and switched off the old pack once all 6 regional managers used the new report every week"
        source: [T001]
  - title: Junior Business Analyst
    organization: Vistula Logistics
    location: Kraków, Poland
    start: 2020-07
    end: 2022-03
    description: "Third-party logistics operator, 2 warehouses, about 250 warehouse staff"
    bullets:
      - text: "Spent two night shifts on the warehouse floor with the shift leaders, then built an hourly picking-accuracy dashboard in Power BI from scanner data, showing errors during the shift instead of a week later"
        source: [T003]
      - text: "Trained all 8 shift leaders in both warehouses to use it at handover; picking errors fell 18% in three months"
        source: [T003]

